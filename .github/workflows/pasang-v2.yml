name: Pasang dashboard v2
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/pasang-v2.yml']
permissions:
  contents: write
jobs:
  pasang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh dashboard
        run: |
          curl -fsSL -o index.html 'https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/21/66a5147a.html?expires=1795288340&sig=5f99a6e42392c81687e20a85e693880f205b996c464a896343d2b5907352a648'
          echo '36e65e6a8e5365665e56826eead764379cdf092ad79b77beb0250a2982b08564  index.html' | sha256sum -c -
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/pasang-v2.yml
          git add index.html
          git commit -m 'Pasang dashboard monitoring cuti v2'
          git push
