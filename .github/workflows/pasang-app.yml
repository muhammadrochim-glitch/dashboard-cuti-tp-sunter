name: Pasang app
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/pasang-app.yml']
permissions:
  contents: write
jobs:
  pasang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh app
        run: |
          curl -fsSL -o app.html 'https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/19/4a293e1a.html?expires=1795045781&sig=b409f3d9f23ae67dde36d16fa22afa3afa420a81b2878609478080828d30f99d'
          echo '62913543de6523e66094b4efb387d876efe768689f27c9cdd703ef2601c35f2b  app.html' | sha256sum -c -
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/pasang-app.yml
          git add app.html
          git commit -m 'Pasang app dashboard (data dari Google Sheet)'
          git push
